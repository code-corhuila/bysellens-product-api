spring.application.name=product-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bysellens_db?currentSchema=product}
spring.datasource.username=${DB_USER:product_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=product

spring.flyway.default-schema=product
spring.flyway.schemas=product

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

inventory.url=${INVENTORY_URL:http://inventory-service:8080}
logging.pattern.level=%5p [requestId=%X{requestId}]
